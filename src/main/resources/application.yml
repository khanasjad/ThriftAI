server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ThriftAI
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:thriftai
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  # Thymeleaf Configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
  
  # Web Configuration
  web:
    resources:
      static-locations: classpath:/static/

# Custom ThriftAI Configuration
thriftai:
  ai:
    enabled: true
    api:
      url: "http://localhost:8080/api/v1"
      key: "demo-api-key"
  
  app:
    name: "ThriftAI - Smart Thrift Shopping"
    version: "1.0.0"
    description: "AI-Powered Thrift Shopping Assistant"

# OpenAI Configuration
openai:
  api:
    key: ${OPENAI_API_KEY:}  # Set via environment variable or leave empty for fallback mode
    url: "https://api.openai.com/v1/chat/completions"
    model: "gpt-3.5-turbo"
    max-tokens: 500
    temperature: 0.7
  vision:
    enabled: true
    model: "gpt-4-vision-preview"
    max-tokens: 300

# Claude API Configuration
claude:
  api:
    key: ${CLAUDE_API_KEY:}  # Set via environment variable
    url: "https://api.anthropic.com/v1/messages"
    model: "claude-3-sonnet-20240229"
    max-tokens: 1000
    temperature: 0.7
    version: "2023-06-01"
  streaming:
    enabled: true
    chunk-size: 256

# Logging Configuration
logging:
  level:
    com.projectai: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management Endpoints (for monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ThriftAI
  
  # Database Configuration (Profile-based)
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:thriftai}
    driverClassName: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}

  jpa:
    database-platform: ${DATABASE_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${DATABASE_DDL_AUTO:create-drop}
    show-sql: ${DATABASE_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway Migration Configuration
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: true
  
  # Thymeleaf Configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
  
  # Web Configuration
  web:
    resources:
      static-locations: classpath:/static/

# Custom ThriftAI Configuration
thriftai:
  ai:
    enabled: true
    api:
      url: "http://localhost:8080/api/v1"
      key: "demo-api-key"
  
  app:
    name: "ThriftAI - Smart Thrift Shopping"
    version: "1.0.0"
    description: "AI-Powered Thrift Shopping Assistant"

# OpenAI Configuration
openai:
  api:
    key: ${OPENAI_API_KEY:}  # Set via environment variable or leave empty for fallback mode
    url: "https://api.openai.com/v1/chat/completions"
    model: "gpt-3.5-turbo"
    max-tokens: 500
    temperature: 0.7
  vision:
    enabled: true
    model: "gpt-4-vision-preview"
    max-tokens: 300

# Claude API Configuration
claude:
  api:
    key: ${CLAUDE_API_KEY:}  # Set via environment variable
    url: "https://api.anthropic.com/v1/messages"
    model: "claude-3-sonnet-20240229"
    max-tokens: 1000
    temperature: 0.7
    version: "2023-06-01"
  streaming:
    enabled: true
    chunk-size: 256

# Payment Processing Configuration
payments:
  stripe:
    public-key: ${STRIPE_PUBLIC_KEY:pk_test_}  # Stripe publishable key
    secret-key: ${STRIPE_SECRET_KEY:sk_test_}  # Stripe secret key
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_}  # Stripe webhook endpoint secret
    currency: "usd"
    capture-method: "automatic"

  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}  # PayPal client ID
    client-secret: ${PAYPAL_CLIENT_SECRET:}  # PayPal client secret
    environment: ${PAYPAL_ENVIRONMENT:sandbox}  # sandbox or live
    webhook-id: ${PAYPAL_WEBHOOK_ID:}  # PayPal webhook ID

  processing:
    enabled: true
    default-provider: "stripe"  # stripe or paypal
    retry-attempts: 3
    timeout-seconds: 30

  payouts:
    enabled: true
    schedule: "daily"  # daily, weekly, monthly
    minimum-amount: 10.00
    processing-fee: 0.25  # Fixed fee per payout
    percentage-fee: 0.02  # 2% of payout amount

# Logging Configuration
logging:
  level:
    com.projectai: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management Endpoints (for monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
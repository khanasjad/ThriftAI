server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ThriftAI
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:thriftai
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  # Thymeleaf Configuration
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html
  
  # Web Configuration
  web:
    resources:
      static-locations: classpath:/static/

# Custom ThriftAI Configuration
thriftai:
  ai:
    enabled: false
    api:
      url: ""
      key: ""
  
  app:
    name: "ThriftAI - Smart Thrift Shopping"
    version: "1.0.0"
    description: "AI-Powered Thrift Shopping Assistant"

# Logging Configuration
logging:
  level:
    com.projectai: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management Endpoints (for monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
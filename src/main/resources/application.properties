# Server Configuration
server.port=8080
server.address=0.0.0.0

# Database Configuration  
spring.datasource.url=jdbc:h2:mem:thriftai
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.com.projectai=INFO

# Error handling
server.error.whitelabel.enabled=false

# Force web application type
spring.main.web-application-type=servlet

# DevTools Configuration
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# AI Configuration
openai.api.key=${OPENAI_API_KEY:demo-key}
claude.api.key=${CLAUDE_API_KEY:demo-key}
visual.search.provider=${VISUAL_SEARCH_PROVIDER:openai}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# External API Configuration (for marketplace integration)
amazon.api.key=${AMAZON_API_KEY:demo-key}
amazon.api.secret=${AMAZON_API_SECRET:demo-secret}
amazon.associate.tag=${AMAZON_ASSOCIATE_TAG:thriftai-20}
ebay.api.key=${EBAY_API_KEY:demo-key}
nike.api.key=${NIKE_API_KEY:demo-key}
adidas.api.key=${ADIDAS_API_KEY:demo-key}

# Location Services
google.maps.api.key=${GOOGLE_MAPS_API_KEY:demo-key}
shipping.service.provider=${SHIPPING_PROVIDER:shippo}

# Shipping Services
fedex.api.key=${FEDEX_API_KEY:demo-key}
ups.api.key=${UPS_API_KEY:demo-key}
usps.api.key=${USPS_API_KEY:demo-key}
dhl.api.key=${DHL_API_KEY:demo-key}

# Commission and Payout Configuration
commission.processing.fee=0.029
commission.minimum.payout=10.0
commission.payout.schedule=weekly
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head th:fragment="page-head">
    <title>Seller Registration - ThriftAI</title>
    <style>
        .modern-form-container {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 25px 45px rgba(0,0,0,0.1);
            padding: 2rem;
        }
        
        .floating-label-group {
            position: relative;
            margin-bottom: 2rem;
        }
        
        .floating-label-input {
            width: 100%;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .floating-label-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.3);
            background: rgba(255,255,255,0.1);
        }
        
        .floating-label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 1rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .floating-label-input:focus + .floating-label,
        .floating-label-input.filled + .floating-label {
            top: -8px;
            left: 8px;
            font-size: 0.75rem;
            color: #00d4ff;
            background: rgba(0,0,0,0.8);
            padding: 0 0.5rem;
            border-radius: 4px;
        }
        
        .btn-glow {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,212,255,0.3);
        }
        
        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0,212,255,0.4);
            background: linear-gradient(135deg, #00d4ff 0%, #0088bb 100%);
        }
    </style>
</head>

<body>
<main th:fragment="content" class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="modern-form-container">
                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold text-gradient-primary mb-3">
                        <i class="fas fa-store me-3"></i>Become a Seller
                    </h1>
                    <p class="lead text-muted">Join thousands of successful sellers on ThriftAI marketplace</p>
                </div>

                <form th:action="@{/sellers/register}" method="post" th:object="${seller}">
                    <!-- Step 1: Basic Information -->
                    <div class="step" id="step-1">
                        <h3 class="mb-4 text-center">Basic Information</h3>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="floating-label-group">
                                    <input type="text" class="floating-label-input" id="businessName" th:field="*{businessName}" required>
                                    <label class="floating-label">Business Name *</label>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="floating-label-group">
                                    <input type="text" class="floating-label-input" id="ownerName" th:field="*{ownerName}" required>
                                    <label class="floating-label">Owner Name *</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="floating-label-group">
                                    <input type="email" class="floating-label-input" id="email" th:field="*{email}" required>
                                    <label class="floating-label">Email Address *</label>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="floating-label-group">
                                    <input type="tel" class="floating-label-input" id="phone" th:field="*{phone}" required>
                                    <label class="floating-label">Phone Number *</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="floating-label-group">
                            <textarea class="floating-label-input" id="description" th:field="*{description}" rows="4" required></textarea>
                            <label class="floating-label">Business Description *</label>
                        </div>
                        
                        <div class="floating-label-group">
                            <select class="floating-label-input" id="sellerType" th:field="*{sellerType}" required>
                                <option value="">Select Seller Type</option>
                                <option value="INDIVIDUAL">Individual</option>
                                <option value="BUSINESS">Business</option>
                                <option value="THRIFT_STORE">Thrift Store</option>
                                <option value="CONSIGNMENT_SHOP">Consignment Shop</option>
                            </select>
                        </div>
                    </div>

                    <!-- Step 2: Location Information -->
                    <div class="step d-none" id="step-2">
                        <h3 class="mb-4 text-center">Location Information</h3>
                        
                        <div class="floating-label-group">
                            <input type="text" class="floating-label-input" id="address" th:field="*{address}" required>
                            <label class="floating-label">Business Address *</label>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-4">
                                <div class="floating-label-group">
                                    <input type="text" class="floating-label-input" id="city" th:field="*{city}" required>
                                    <label class="floating-label">City *</label>
                                </div>
                            </div>
                            
                            <div class="col-md-4">
                                <div class="floating-label-group">
                                    <input type="text" class="floating-label-input" id="state" th:field="*{state}" required>
                                    <label class="floating-label">State *</label>
                                </div>
                            </div>
                            
                            <div class="col-md-4">
                                <div class="floating-label-group">
                                    <input type="text" class="floating-label-input" id="zipCode" th:field="*{zipCode}" required>
                                    <label class="floating-label">ZIP Code *</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="floating-label-group">
                            <input type="url" class="floating-label-input" id="website" th:field="*{website}">
                            <label class="floating-label">Website (Optional)</label>
                        </div>
                    </div>

                    <!-- Step 3: Business Details -->
                    <div class="step d-none" id="step-3">
                        <h3 class="mb-4 text-center">Business Details</h3>
                        
                        <div class="floating-label-group">
                            <input type="text" class="floating-label-input" id="taxId" th:field="*{taxId}">
                            <label class="floating-label">Tax ID (Optional)</label>
                        </div>
                        
                        <div class="floating-label-group">
                            <input type="text" class="floating-label-input" id="businessLicense" th:field="*{businessLicense}">
                            <label class="floating-label">Business License (Optional)</label>
                        </div>
                        
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="termsAgreement" required>
                            <label class="form-check-label" for="termsAgreement">
                                I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a>
                            </label>
                        </div>
                    </div>

                    <!-- Navigation Buttons -->
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn btn-outline-secondary" id="prevBtn" onclick="previousStep()" style="display: none;">
                            <i class="fas fa-arrow-left me-2"></i>Previous
                        </button>
                        
                        <button type="button" class="btn btn-glow" id="nextBtn" onclick="nextStep()">
                            Next<i class="fas fa-arrow-right ms-2"></i>
                        </button>
                        
                        <button type="submit" class="btn btn-glow d-none" id="submitBtn">
                            <i class="fas fa-check me-2"></i>Register
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 3;

        function showStep(step) {
            // Hide all steps
            document.querySelectorAll('.step').forEach(s => s.classList.add('d-none'));
            
            // Show current step
            document.getElementById('step-' + step).classList.remove('d-none');
            
            // Update navigation buttons
            document.getElementById('prevBtn').style.display = step === 1 ? 'none' : 'inline-block';
            document.getElementById('nextBtn').style.display = step === totalSteps ? 'none' : 'inline-block';
            document.getElementById('submitBtn').classList.toggle('d-none', step !== totalSteps);
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                showStep(currentStep);
            }
        }

        function previousStep() {
            if (currentStep > 1) {
                currentStep--;
                showStep(currentStep);
            }
        }

        // Floating label animations
        document.querySelectorAll('.floating-label-input').forEach(input => {
            input.addEventListener('blur', () => {
                if (input.value) {
                    input.classList.add('filled');
                } else {
                    input.classList.remove('filled');
                }
            });
        });
        
        // Initialize form
        showStep(1);
    </script>
</main>
</body>
</html>

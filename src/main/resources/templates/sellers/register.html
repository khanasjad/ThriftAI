<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head th:fragment="page-head">
    <title>Seller Registration - ThriftAI</title>
</head>

<body>
<main th:fragment="content" class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card border-0 shadow-soft">
                <div class="card-header bg-gradient-primary text-white text-center py-4">
                    <h2 class="mb-0">
                        <i class="fas fa-store me-2"></i>Become a Seller
                    </h2>
                    <p class="mb-0 mt-2">Join the ThriftAI marketplace and start selling today!</p>
                </div>
                
                <div class="card-body p-4">
                    <form th:action="@{/sellers/register}" method="post" th:object="${seller}">
                        
                        <!-- Business Information -->
                        <div class="mb-4">
                            <h5 class="text-primary mb-3">
                                <i class="fas fa-building me-2"></i>Business Information
                            </h5>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="businessName" class="form-label">Business Name *</label>
                                    <input type="text" class="form-control" id="businessName" 
                                           th:field="*{businessName}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('businessName')}" 
                                         th:errors="*{businessName}"></div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="ownerName" class="form-label">Owner Name *</label>
                                    <input type="text" class="form-control" id="ownerName" 
                                           th:field="*{ownerName}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('ownerName')}" 
                                         th:errors="*{ownerName}"></div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="sellerType" class="form-label">Business Type *</label>
                                    <select class="form-select" id="sellerType" th:field="*{sellerType}" required>
                                        <option value="">Select Business Type</option>
                                        <option value="INDIVIDUAL">Individual Seller</option>
                                        <option value="BUSINESS">Small Business</option>
                                        <option value="THRIFT_STORE">Thrift Store</option>
                                        <option value="CONSIGNMENT_SHOP">Consignment Shop</option>
                                    </select>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="website" class="form-label">Website (Optional)</label>
                                    <input type="url" class="form-control" id="website" 
                                           th:field="*{website}" placeholder="https://yourwebsite.com">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">Business Description</label>
                                <textarea class="form-control" id="description" rows="3" 
                                          th:field="*{description}" 
                                          placeholder="Tell us about your business and what you sell..."></textarea>
                                <div class="text-danger" th:if="${#fields.hasErrors('description')}" 
                                     th:errors="*{description}"></div>
                            </div>
                        </div>

                        <!-- Contact Information -->
                        <div class="mb-4">
                            <h5 class="text-primary mb-3">
                                <i class="fas fa-address-book me-2"></i>Contact Information
                            </h5>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email Address *</label>
                                    <input type="email" class="form-control" id="email" 
                                           th:field="*{email}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" 
                                         th:errors="*{email}"></div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">Phone Number *</label>
                                    <input type="tel" class="form-control" id="phone" 
                                           th:field="*{phone}" required placeholder="+1234567890">
                                    <div class="text-danger" th:if="${#fields.hasErrors('phone')}" 
                                         th:errors="*{phone}"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Address Information -->
                        <div class="mb-4">
                            <h5 class="text-primary mb-3">
                                <i class="fas fa-map-marker-alt me-2"></i>Address Information
                            </h5>
                            
                            <div class="mb-3">
                                <label for="address" class="form-label">Street Address *</label>
                                <input type="text" class="form-control" id="address" 
                                       th:field="*{address}" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('address')}" 
                                     th:errors="*{address}"></div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="city" class="form-label">City</label>
                                    <input type="text" class="form-control" id="city" th:field="*{city}">
                                </div>
                                
                                <div class="col-md-4 mb-3">
                                    <label for="state" class="form-label">State</label>
                                    <input type="text" class="form-control" id="state" th:field="*{state}">
                                </div>
                                
                                <div class="col-md-4 mb-3">
                                    <label for="zipCode" class="form-label">Zip Code</label>
                                    <input type="text" class="form-control" id="zipCode" th:field="*{zipCode}">
                                </div>
                            </div>
                        </div>

                        <!-- Business Credentials (Optional) -->
                        <div class="mb-4">
                            <h5 class="text-primary mb-3">
                                <i class="fas fa-certificate me-2"></i>Business Credentials (Optional)
                            </h5>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="businessLicense" class="form-label">Business License Number</label>
                                    <input type="text" class="form-control" id="businessLicense" 
                                           th:field="*{businessLicense}">
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="taxId" class="form-label">Tax ID / EIN</label>
                                    <input type="text" class="form-control" id="taxId" 
                                           th:field="*{taxId}">
                                </div>
                            </div>
                        </div>

                        <!-- Categories -->
                        <div class="mb-4">
                            <h5 class="text-primary mb-3">
                                <i class="fas fa-tags me-2"></i>Product Categories
                            </h5>
                            <p class="text-muted mb-3">Select the categories of items you plan to sell:</p>
                            
                            <div class="row">
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="categories" 
                                               value="CLOTHING" id="catClothing">
                                        <label class="form-check-label" for="catClothing">
                                            Clothing & Apparel
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="categories" 
                                               value="SHOES" id="catShoes">
                                        <label class="form-check-label" for="catShoes">
                                            Shoes & Footwear
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="categories" 
                                               value="ACCESSORIES" id="catAccessories">
                                        <label class="form-check-label" for="catAccessories">
                                            Accessories & Bags
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="categories" 
                                               value="ELECTRONICS" id="catElectronics">
                                        <label class="form-check-label" for="catElectronics">
                                            Electronics
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="categories" 
                                               value="HOME" id="catHome">
                                        <label class="form-check-label" for="catHome">
                                            Home & Garden
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="categories" 
                                               value="BOOKS" id="catBooks">
                                        <label class="form-check-label" for="catBooks">
                                            Books & Media
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Terms and Conditions -->
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="termsAccepted" required>
                                <label class="form-check-label" for="termsAccepted">
                                    I agree to the <a href="#" class="text-primary">Terms of Service</a> 
                                    and <a href="#" class="text-primary">Privacy Policy</a> *
                                </label>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-user-plus me-2"></i>Register as Seller
                            </button>
                        </div>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                Already have an account? 
                                <a href="#" class="text-primary">Sign in here</a>
                            </small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

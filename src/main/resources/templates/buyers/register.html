<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head th:fragment="page-head">
    <title>Buyer Registration - ThriftAI</title>
</head>

<body>
<main th:fragment="content" class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card border-0 shadow-soft">
                <div class="card-header bg-gradient-primary text-white text-center py-4">
                    <h2 class="mb-0">
                        <i class="fas fa-shopping-cart me-2"></i>Join as Buyer
                    </h2>
                    <p class="mb-0 mt-2">Start your smart shopping journey with ThriftAI!</p>
                </div>
                
                <div class="card-body p-4">
                    <form th:action="@{/buyers/register}" method="post" th:object="${buyer}">
                        
                        <!-- Personal Information -->
                        <div class="mb-4">
                            <h5 class="text-primary mb-3">
                                <i class="fas fa-user me-2"></i>Personal Information
                            </h5>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="firstName" class="form-label">First Name *</label>
                                    <input type="text" class="form-control" id="firstName" 
                                           th:field="*{firstName}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" 
                                         th:errors="*{firstName}"></div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="lastName" class="form-label">Last Name *</label>
                                    <input type="text" class="form-control" id="lastName" 
                                           th:field="*{lastName}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" 
                                         th:errors="*{lastName}"></div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">Email Address *</label>
                                    <input type="email" class="form-control" id="email" 
                                           th:field="*{email}" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" 
                                         th:errors="*{email}"></div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone" 
                                           th:field="*{phone}" placeholder="+1234567890">
                                    <div class="text-danger" th:if="${#fields.hasErrors('phone')}" 
                                         th:errors="*{phone}"></div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="dateOfBirth" class="form-label">Date of Birth</label>
                                    <input type="date" class="form-control" id="dateOfBirth" 
                                           th:field="*{dateOfBirth}">
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="gender" class="form-label">Gender</label>
                                    <select class="form-select" id="gender" th:field="*{gender}">
                                        <option value="">Prefer not to say</option>
                                        <option value="MALE">Male</option>
                                        <option value="FEMALE">Female</option>
                                        <option value="NON_BINARY">Non-binary</option>
                                        <option value="PREFER_NOT_TO_SAY">Prefer not to say</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Address Information -->
                        <div class="mb-4">
                            <h5 class="text-primary mb-3">
                                <i class="fas fa-map-marker-alt me-2"></i>Address Information
                            </h5>
                            
                            <div class="mb-3">
                                <label for="address" class="form-label">Street Address</label>
                                <input type="text" class="form-control" id="address" th:field="*{address}">
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="city" class="form-label">City</label>
                                    <input type="text" class="form-control" id="city" th:field="*{city}">
                                </div>
                                
                                <div class="col-md-4 mb-3">
                                    <label for="state" class="form-label">State</label>
                                    <input type="text" class="form-control" id="state" th:field="*{state}">
                                </div>
                                
                                <div class="col-md-4 mb-3">
                                    <label for="zipCode" class="form-label">Zip Code</label>
                                    <input type="text" class="form-control" id="zipCode" th:field="*{zipCode}">
                                </div>
                            </div>
                        </div>

                        <!-- Shopping Preferences -->
                        <div class="mb-4">
                            <h5 class="text-primary mb-3">
                                <i class="fas fa-heart me-2"></i>Shopping Preferences
                            </h5>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="maxBudget" class="form-label">Maximum Budget per Item</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" class="form-control" id="maxBudget" 
                                               th:field="*{maxBudget}" min="0" step="0.01" value="500">
                                    </div>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label for="minDiscountThreshold" class="form-label">Minimum Discount (%)</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="minDiscountThreshold" 
                                               th:field="*{minDiscountThreshold}" min="0" max="100" step="1" value="10">
                                        <span class="input-group-text">%</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="buyerType" class="form-label">Shopping Style</label>
                                <select class="form-select" id="buyerType" th:field="*{buyerType}">
                                    <option value="CASUAL">Casual Shopper</option>
                                    <option value="FREQUENT">Frequent Buyer</option>
                                    <option value="VIP">VIP Member</option>
                                    <option value="BULK_BUYER">Bulk Buyer</option>
                                </select>
                            </div>
                        </div>

                        <!-- Preferred Categories -->
                        <div class="mb-4">
                            <h5 class="text-primary mb-3">
                                <i class="fas fa-tags me-2"></i>Preferred Categories
                            </h5>
                            <p class="text-muted mb-3">Select your favorite shopping categories:</p>
                            
                            <div class="row">
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="preferredCategories" 
                                               value="CLOTHING" id="prefClothing">
                                        <label class="form-check-label" for="prefClothing">
                                            Clothing & Apparel
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="preferredCategories" 
                                               value="SHOES" id="prefShoes">
                                        <label class="form-check-label" for="prefShoes">
                                            Shoes & Footwear
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="preferredCategories" 
                                               value="ACCESSORIES" id="prefAccessories">
                                        <label class="form-check-label" for="prefAccessories">
                                            Accessories & Bags
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="preferredCategories" 
                                               value="ELECTRONICS" id="prefElectronics">
                                        <label class="form-check-label" for="prefElectronics">
                                            Electronics
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="preferredCategories" 
                                               value="HOME" id="prefHome">
                                        <label class="form-check-label" for="prefHome">
                                            Home & Garden
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-4 mb-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="preferredCategories" 
                                               value="BOOKS" id="prefBooks">
                                        <label class="form-check-label" for="prefBooks">
                                            Books & Media
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Notification Preferences -->
                        <div class="mb-4">
                            <h5 class="text-primary mb-3">
                                <i class="fas fa-bell me-2"></i>Notification Preferences
                            </h5>
                            
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="receiveNewsletters" 
                                               th:field="*{receiveNewsletters}" checked>
                                        <label class="form-check-label" for="receiveNewsletters">
                                            Email Newsletter
                                        </label>
                                    </div>
                                </div>
                                
                                <div class="col-md-4 mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="receiveDeals" 
                                               th:field="*{receiveDeals}" checked>
                                        <label class="form-check-label" for="receiveDeals">
                                            Deal Alerts
                                        </label>
                                    </div>
                                </div>
                                
                                <div class="col-md-4 mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="receiveSms" 
                                               th:field="*{receiveSms}">
                                        <label class="form-check-label" for="receiveSms">
                                            SMS Notifications
                                        </label>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="notificationFrequency" class="form-label">Notification Frequency</label>
                                <select class="form-select" id="notificationFrequency" th:field="*{notificationFrequency}">
                                    <option value="DAILY">Daily</option>
                                    <option value="WEEKLY">Weekly</option>
                                    <option value="MONTHLY">Monthly</option>
                                    <option value="NEVER">Never</option>
                                </select>
                            </div>
                        </div>

                        <!-- Terms and Conditions -->
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="termsAccepted" required>
                                <label class="form-check-label" for="termsAccepted">
                                    I agree to the <a href="#" class="text-primary">Terms of Service</a> 
                                    and <a href="#" class="text-primary">Privacy Policy</a> *
                                </label>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-shopping-cart me-2"></i>Join ThriftAI
                            </button>
                        </div>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                Already have an account? 
                                <a href="#" class="text-primary">Sign in here</a>
                            </small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>

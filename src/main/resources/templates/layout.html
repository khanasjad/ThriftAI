<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - ThriftAI' : 'ThriftAI - Smart Thrift Shopping'}">ThriftAI - Smart Thrift Shopping</title>
    
    <!-- Bootstrap CSS -->
    <link href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
    
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet"/>
    
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    
    <!-- Page-specific head content -->
    <th:block th:replace="${pageHead} ?: ~{}"></th:block>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="fas fa-robot me-2" style="color: #00d4ff;"></i>
                <span style="background: linear-gradient(135deg, #00d4ff 0%, #ffffff 50%, #00d4ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700;">Thrift</span><span style="color: var(--text-primary); font-weight: 300;">AI</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/analytics}">
                            Analytics
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/sellers}">
                            Sellers
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/buyers}">
                            Buyers
                        </a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <!-- Show auth buttons when not logged in -->
                    <li th:if="${session.user == null}" class="nav-item">
                        <a class="nav-link btn btn-outline-light me-2" th:href="@{/auth/login}" style="border-radius: var(--radius-md); padding: 0.5rem 1rem;">
                            <i class="fas fa-sign-in-alt me-1"></i>Login
                        </a>
                    </li>
                    <li th:if="${session.user == null}" class="nav-item">
                        <a class="nav-link btn" th:href="@{/auth/signup}" style="background: var(--accent); color: white; border-radius: var(--radius-md); padding: 0.5rem 1rem; margin-left: 0.5rem;">
                            <i class="fas fa-user-plus me-1"></i>Sign Up
                        </a>
                    </li>
                    
                    <!-- Show user menu when logged in -->
                    <li th:if="${session.user != null}" class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user me-2"></i>
                            <span th:if="${session.userType == 'buyer'}" th:text="${session.user.firstName}">User</span>
                            <span th:if="${session.userType == 'seller'}" th:text="${session.user.ownerName}">User</span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-cog me-2"></i>Preferences</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-heart me-2"></i>Favorites</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/about}"><i class="fas fa-info me-2"></i>About</a></li>
                            <li><a class="dropdown-item" th:href="@{/contact}"><i class="fas fa-envelope me-2"></i>Contact</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" th:href="@{/auth/logout}"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-4">
        <th:block th:replace="${content} ?: ~{}"></th:block>
    </main>

    <!-- Footer -->
    <footer class="text-light mt-5 py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>
                        <i class="fas fa-robot me-2" style="color: #00d4ff;"></i>
                        <span style="background: linear-gradient(135deg, #00d4ff 0%, #ffffff 50%, #00d4ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700;">Thrift</span><span style="color: var(--text-primary); font-weight: 300;">AI</span>
                    </h5>
                    <p class="mb-0">AI-powered thrift shopping for the smartest deals.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <div class="social-links">
                        <a href="#" class="text-light me-3"><i class="fab fa-twitter"></i></a>
                        <a href="#" class="text-light me-3"><i class="fab fa-facebook"></i></a>
                        <a href="#" class="text-light me-3"><i class="fab fa-instagram"></i></a>
                        <a href="#" class="text-light"><i class="fab fa-github"></i></a>
                    </div>
                    <p class="mb-0 mt-2"><small>&copy; 2024 ThriftAI. All rights reserved.</small></p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
    <script src="/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="/js/main.js"></script>
    
    <!-- Page-specific scripts -->
    <th:block th:replace="${pageScripts} ?: ~{}"></th:block>
</body>
</html>

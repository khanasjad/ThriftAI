<!DOCTYPE html>
<html>
<head>
    <title>AI Search Test</title>
    <link href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <style>
        body { background: #1a1a1a; color: white; }
        .search-container { max-width: 800px; margin: 50px auto; padding: 20px; }
        .message { margin: 10px 0; padding: 15px; border-radius: 10px; }
        .user { background: #007bff; margin-left: 20%; }
        .ai { background: #28a745; margin-right: 20%; }
        .product-card { 
            background: #2d2d2d; 
            border: 1px solid #444; 
            border-radius: 10px; 
            padding: 15px; 
            margin: 10px; 
            display: inline-block; 
            width: 300px; 
        }
        .insights { background: #ffc107; color: black; padding: 10px; border-radius: 5px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="search-container">
        <h1><i class="fas fa-robot"></i> AI Search Test</h1>
        
        <div class="input-group mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Search for thrift items..." onkeypress="handleEnter(event)">
            <button class="btn btn-primary" onclick="search()">
                <i class="fas fa-search"></i> Search
            </button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        function handleEnter(event) {
            if (event.key === 'Enter') {
                search();
            }
        }

        function search() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="text-center"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
            
            fetch('/ai/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: query,
                    type: 'search'
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Response:', data);
                displayResults(data, query);
            })
            .catch(error => {
                console.error('Error:', error);
                resultsDiv.innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
            });
        }

        function displayResults(data, query) {
            const resultsDiv = document.getElementById('results');
            
            if (!data.success) {
                resultsDiv.innerHTML = '<div class="alert alert-danger">Search failed: ' + (data.error || 'Unknown error') + '</div>';
                return;
            }

            let html = '';
            
            // User message
            html += `<div class="message user">You: ${query}</div>`;
            
            // AI message
            html += `<div class="message ai">AI: ${data.message.replace(/\n/g, '<br>')}</div>`;
            
            // Insights
            if (data.insights && data.insights.length > 0) {
                html += '<div class="insights"><h5><i class="fas fa-lightbulb"></i> AI Insights</h5>';
                data.insights.forEach(insight => {
                    html += `<div>• ${insight}</div>`;
                });
                html += '</div>';
            }
            
            // Products
            if (data.products && data.products.length > 0) {
                html += '<h5><i class="fas fa-shopping-bag"></i> Found Products</h5>';
                html += '<div class="row">';
                data.products.forEach(product => {
                    const discount = product.originalPrice > 0 ? 
                        Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100) : 0;
                    
                    html += `
                        <div class="col-md-6">
                            <div class="product-card">
                                <h6>${product.name}</h6>
                                <div><strong>Brand:</strong> ${product.brand}</div>
                                <div><strong>Price:</strong> $${product.price} 
                                    ${product.originalPrice > 0 ? `<small>(was $${product.originalPrice})</small>` : ''}
                                    ${discount > 0 ? `<span class="badge bg-danger">${discount}% OFF</span>` : ''}
                                </div>
                                <div><strong>Condition:</strong> ${product.condition}</div>
                                <div><strong>Size:</strong> ${product.size}</div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }
            
            resultsDiv.innerHTML = html;
        }

        // Auto-focus input
        document.getElementById('searchInput').focus();
    </script>
</body>
</html>

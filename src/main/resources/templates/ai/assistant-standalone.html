<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shopping Assistant - ThriftAI</title>
    
    <!-- Bootstrap CSS -->
    <link href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
    
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet"/>
    
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    
    <style>
        .ai-chat-container {
            height: 80vh;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
        }
        
        .ai-header {
            background: var(--gradient-primary);
            color: var(--black);
            padding: 1.5rem 2rem;
            font-weight: 600;
            border-radius: 20px 20px 0 0;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 2rem;
        }
        
        .message {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 15px;
            max-width: 80%;
        }
        
        .message.user {
            background: var(--primary);
            color: white;
            margin-left: auto;
        }
        
        .message.ai {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
        }
        
        .chat-input-area {
            padding: 1rem 2rem;
            border-top: 1px solid var(--glass-border);
        }
        
        .chat-input {
            display: flex;
            gap: 0.5rem;
        }
        
        .chat-input input {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            background: var(--glass-bg);
            color: var(--text-primary);
        }
        
        .chat-input button {
            padding: 0.8rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }
        
        .product-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 1rem;
            margin: 0.5rem;
            display: inline-block;
            width: 280px;
            vertical-align: top;
        }
        
        .insights {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
        }
        
        .typing-indicator {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--glass-bg);
            border-radius: 15px;
            margin: 0.5rem 0;
        }
        
        .spinner {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .spinner:nth-child(1) { animation-delay: -0.32s; }
        .spinner:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .cursor {
            display: inline-block;
            color: var(--primary);
            animation: blink 1s infinite;
            font-weight: bold;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .streaming-text {
            display: inline;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-robot me-2" style="color: #00d4ff;"></i>
                <span style="background: linear-gradient(135deg, #00d4ff 0%, #ffffff 50%, #00d4ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700;">Thrift</span><span style="color: var(--text-primary); font-weight: 300;">AI</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">
                <div class="ai-chat-container">
                    <!-- Header -->
                    <div class="ai-header">
                        <h4 class="mb-0">
                            <i class="fas fa-robot me-2"></i>
                            AI Shopping Assistant
                        </h4>
                        <small>Ask me anything about thrift shopping!</small>
                    </div>
                    
                    <!-- Messages -->
                    <div class="chat-messages" id="chatMessages">
                        <div class="message ai">
                            <strong>AI Assistant:</strong> Hello! I'm your AI shopping assistant. I can help you find the best thrift deals, compare prices, and discover amazing secondhand treasures. What are you looking for today?
                        </div>
                    </div>
                    
                    <!-- Input -->
                    <div class="chat-input-area">
                        <div class="chat-input">
                            <input type="text" id="messageInput" placeholder="Search for vintage jackets, shoes, electronics..." onkeypress="handleKeyPress(event)">
                            <button onclick="sendMessage()">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isTyping = false;
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message && !isTyping) {
                addUserMessage(message);
                input.value = '';
                showTypingIndicator();
                
                // Simulate streaming response
                simulateStreamingResponse(message);
            }
        }
        
        function simulateStreamingResponse(userMessage) {
            // First get the actual response from the API
            fetch('/ai/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: userMessage,
                    type: 'search'
                })
            })
            .then(response => response.json())
            .then(data => {
                hideTypingIndicator();
                if (data.success) {
                    // Stream the response word by word
                    streamText(data.message, data);
                } else {
                    addAIMessage('Sorry, something went wrong. Please try again.');
                }
            })
            .catch(error => {
                hideTypingIndicator();
                addAIMessage('Sorry, I\'m having trouble connecting. Please try again.');
            });
        }
        
        function streamText(fullMessage, data) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            
            // Create the message structure
            let content = '<strong>AI Assistant:</strong> <span class="streaming-text"></span><span class="cursor">|</span>';
            
            messageDiv.innerHTML = content;
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
            
            const streamingText = messageDiv.querySelector('.streaming-text');
            const cursor = messageDiv.querySelector('.cursor');
            
            const words = fullMessage.split(' ');
            let currentText = '';
            let wordIndex = 0;
            
            const streamInterval = setInterval(() => {
                if (wordIndex < words.length) {
                    currentText += (wordIndex > 0 ? ' ' : '') + words[wordIndex];
                    streamingText.textContent = currentText;
                    wordIndex++;
                    scrollToBottom();
                } else {
                    // Remove cursor and add additional content
                    cursor.remove();
                    
                    // Add insights and products if available
                    if (data && data.insights && data.insights.length > 0) {
                        content += '<div class="insights"><h6><i class="fas fa-lightbulb"></i> AI Insights</h6>';
                        data.insights.forEach(insight => {
                            content += `<div>• ${insight}</div>`;
                        });
                        content += '</div>';
                    }
                    
                    // Add products
                    if (data && data.products && data.products.length > 0) {
                        content += '<h6 class="mt-3"><i class="fas fa-shopping-bag"></i> Found Products</h6>';
                        data.products.forEach(product => {
                            const discount = product.originalPrice > 0 ? 
                                Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100) : 0;
                            
                            content += `
                                <div class="product-card">
                                    <h6>${product.name}</h6>
                                    <div><strong>Brand:</strong> ${product.brand}</div>
                                    <div><strong>Price:</strong> $${product.price}
                                        ${product.originalPrice > 0 ? ` <small>(was $${product.originalPrice})</small>` : ''}
                                        ${discount > 0 ? ` <span class="badge bg-danger">${discount}% OFF</span>` : ''}
                                    </div>
                                    <div><strong>Condition:</strong> ${product.condition}</div>
                                    <div><strong>Size:</strong> ${product.size}</div>
                                </div>
                            `;
                        });
                    }
                    
                    messageDiv.innerHTML = content;
                    clearInterval(streamInterval);
                    scrollToBottom();
                }
            }, 100); // Stream a word every 100ms
        }
        
        function addUserMessage(message) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            messageDiv.innerHTML = `<strong>You:</strong> ${message}`;
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }
        
        function addAIMessage(message, data = null) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            
            let content = `<strong>AI Assistant:</strong> ${message.replace(/\n/g, '<br>')}`;
            
            // Add insights
            if (data && data.insights && data.insights.length > 0) {
                content += '<div class="insights"><h6><i class="fas fa-lightbulb"></i> AI Insights</h6>';
                data.insights.forEach(insight => {
                    content += `<div>• ${insight}</div>`;
                });
                content += '</div>';
            }
            
            // Add products
            if (data && data.products && data.products.length > 0) {
                content += '<h6 class="mt-3"><i class="fas fa-shopping-bag"></i> Found Products</h6>';
                data.products.forEach(product => {
                    const discount = product.originalPrice > 0 ? 
                        Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100) : 0;
                    
                    content += `
                        <div class="product-card">
                            <h6>${product.name}</h6>
                            <div><strong>Brand:</strong> ${product.brand}</div>
                            <div><strong>Price:</strong> $${product.price}
                                ${product.originalPrice > 0 ? ` <small>(was $${product.originalPrice})</small>` : ''}
                                ${discount > 0 ? ` <span class="badge bg-danger">${discount}% OFF</span>` : ''}
                            </div>
                            <div><strong>Condition:</strong> ${product.condition}</div>
                            <div><strong>Size:</strong> ${product.size}</div>
                        </div>
                    `;
                });
            }
            
            messageDiv.innerHTML = content;
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }
        
        function showTypingIndicator() {
            isTyping = true;
            const messagesDiv = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = 'AI is thinking <span class="spinner"></span><span class="spinner"></span><span class="spinner"></span>';
            messagesDiv.appendChild(typingDiv);
            scrollToBottom();
        }
        
        function hideTypingIndicator() {
            isTyping = false;
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }
        
        function scrollToBottom() {
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        // Auto-focus input
        document.getElementById('messageInput').focus();
    </script>

    <!-- Bootstrap JS -->
    <script src="/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>

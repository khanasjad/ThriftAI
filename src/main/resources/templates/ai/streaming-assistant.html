<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html}">
<head th:fragment="page-head">
    <title>AI Streaming Assistant - Claude-like Experience</title>
    <style>
        .streaming-chat-container {
            height: 85vh;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 2rem;
            font-weight: 600;
            border-radius: 20px 20px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.disconnected {
            background: #ef4444;
            animation: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
            scroll-behavior: smooth;
        }
        
        .message {
            margin: 1rem 2rem;
            display: flex;
            gap: 1rem;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar {
            background: var(--primary);
            color: white;
        }
        
        .message.ai .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message-content {
            max-width: 70%;
            padding: 1rem 1.5rem;
            border-radius: 20px;
            position: relative;
        }
        
        .message.user .message-content {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message.ai .message-content {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 5px;
        }
        
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #6b7280;
            font-style: italic;
        }
        
        .typing-dots {
            display: flex;
            gap: 2px;
        }
        
        .typing-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #6b7280;
            animation: typingDots 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typingDots {
            0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        .streaming-text {
            position: relative;
        }
        
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--primary);
            margin-left: 2px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .input-container {
            padding: 1.5rem 2rem;
            border-top: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .input-wrapper {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }
        
        .message-input {
            flex: 1;
            min-height: 44px;
            max-height: 120px;
            padding: 12px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            background: var(--glass-bg);
            color: var(--text-primary);
            resize: none;
            font-family: inherit;
            line-height: 1.4;
        }
        
        .message-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .send-button {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .product-cards {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            overflow-x: auto;
            padding: 0.5rem 0;
        }
        
        .product-card {
            min-width: 200px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .product-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .product-price {
            color: var(--primary);
            font-weight: bold;
        }
        
        .product-brand {
            font-size: 0.9rem;
            color: #6b7280;
        }
    </style>
</head>

<body>
<main th:fragment="content" class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-xl-10">
            <div class="streaming-chat-container">
                <!-- Header -->
                <div class="chat-header">
                    <div>
                        <h4 class="mb-0">
                            <i class="fas fa-robot me-2"></i>
                            ThriftAI Streaming Assistant
                        </h4>
                        <small>Real-time AI responses like Claude & ChatGPT</small>
                    </div>
                    <div class="connection-status">
                        <div class="status-indicator" id="statusIndicator"></div>
                        <span id="statusText">Connecting...</span>
                    </div>
                </div>
                
                <!-- Messages -->
                <div class="messages-container" id="messagesContainer">
                    <div class="message ai">
                        <div class="message-avatar">AI</div>
                        <div class="message-content">
                            <strong>ThriftAI:</strong> Hello! I'm your AI shopping assistant with real-time streaming responses. I can help you find amazing thrift deals, compare prices, and discover sustainable fashion. What are you looking for today?
                        </div>
                    </div>
                </div>
                
                <!-- Input -->
                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea 
                            id="messageInput" 
                            class="message-input" 
                            placeholder="Ask me about thrift shopping, search for items, or get recommendations..."
                            rows="1"></textarea>
                        <button id="sendButton" class="send-button" onclick="sendMessage()">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let eventSource = null;
        let sessionId = null;
        let isConnected = false;
        let currentAiMessage = null;
        let isStreaming = false;

        // Initialize streaming connection
        function initializeStreaming() {
            eventSource = new EventSource('/ai/stream');
            
            eventSource.onopen = function() {
                updateConnectionStatus(true, 'Connected');
                console.log('Streaming connection established');
            };
            
            eventSource.addEventListener('connected', function(event) {
                const data = JSON.parse(event.data);
                sessionId = data.sessionId;
                console.log('Session ID:', sessionId);
            });
            
            eventSource.addEventListener('typing', function(event) {
                showTypingIndicator();
            });
            
            eventSource.addEventListener('text', function(event) {
                const data = JSON.parse(event.data);
                updateStreamingText(data.text, !data.partial);
            });
            
            eventSource.addEventListener('products', function(event) {
                const data = JSON.parse(event.data);
                displayProducts(data.products);
            });
            
            eventSource.addEventListener('complete', function(event) {
                hideTypingIndicator();
                finishStreaming();
            });
            
            eventSource.addEventListener('error', function(event) {
                hideTypingIndicator();
                addErrorMessage('Sorry, there was an error processing your request.');
            });
            
            eventSource.onerror = function() {
                updateConnectionStatus(false, 'Disconnected');
                console.log('Streaming connection lost');
            };
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message && !isStreaming && sessionId) {
                addUserMessage(message);
                input.value = '';
                isStreaming = true;
                updateSendButton(false);
                
                fetch('/ai/stream/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        sessionId: sessionId,
                        type: 'search'
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        addErrorMessage('Failed to start streaming: ' + data.error);
                        finishStreaming();
                    }
                })
                .catch(error => {
                    addErrorMessage('Connection error. Please try again.');
                    finishStreaming();
                });
            }
        }

        function addUserMessage(message) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">You</div>
                <div class="message-content">
                    <strong>You:</strong> ${escapeHtml(message)}
                </div>
            `;
            
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function showTypingIndicator() {
            if (currentAiMessage) return;
            
            const container = document.getElementById('messagesContainer');
            currentAiMessage = document.createElement('div');
            currentAiMessage.className = 'message ai';
            currentAiMessage.id = 'currentAiMessage';
            
            currentAiMessage.innerHTML = `
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <span>ThriftAI is thinking</span>
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>
            `;
            
            container.appendChild(currentAiMessage);
            scrollToBottom();
        }

        function updateStreamingText(text, isComplete) {
            if (!currentAiMessage) {
                showTypingIndicator();
            }
            
            const messageContent = currentAiMessage.querySelector('.message-content');
            const cursor = isComplete ? '' : '<span class="cursor"></span>';
            
            messageContent.innerHTML = `
                <strong>ThriftAI:</strong> 
                <span class="streaming-text">${escapeHtml(text)}${cursor}</span>
            `;
            
            scrollToBottom();
        }

        function displayProducts(products) {
            if (products.length === 0) return;
            
            const container = document.getElementById('messagesContainer');
            const productsDiv = document.createElement('div');
            productsDiv.className = 'message ai';
            
            let productsHtml = `
                <div class="message-avatar">AI</div>
                <div class="message-content">
                    <strong>Found Products:</strong>
                    <div class="product-cards">
            `;
            
            products.forEach(product => {
                const discount = product.originalPrice > 0 ? 
                    Math.round(((product.originalPrice - product.price) / product.originalPrice) * 100) : 0;
                
                productsHtml += `
                    <div class="product-card">
                        <div class="product-name">${escapeHtml(product.name)}</div>
                        <div class="product-brand">${escapeHtml(product.brand)}</div>
                        <div class="product-price">
                            $${product.price}
                            ${discount > 0 ? `<span class="badge bg-danger ms-1">${discount}% OFF</span>` : ''}
                        </div>
                        <div style="font-size: 0.8rem; color: #6b7280; margin-top: 0.5rem;">
                            ${escapeHtml(product.condition)} • ${escapeHtml(product.size)}
                        </div>
                    </div>
                `;
            });
            
            productsHtml += `
                    </div>
                </div>
            `;
            
            productsDiv.innerHTML = productsHtml;
            container.appendChild(productsDiv);
            scrollToBottom();
        }

        function hideTypingIndicator() {
            if (currentAiMessage) {
                const typingIndicator = currentAiMessage.querySelector('.typing-indicator');
                if (typingIndicator) {
                    typingIndicator.style.display = 'none';
                }
            }
        }

        function finishStreaming() {
            isStreaming = false;
            currentAiMessage = null;
            updateSendButton(true);
        }

        function addErrorMessage(message) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            
            messageDiv.innerHTML = `
                <div class="message-avatar">AI</div>
                <div class="message-content" style="border-color: #ef4444;">
                    <strong>Error:</strong> ${escapeHtml(message)}
                </div>
            `;
            
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function updateConnectionStatus(connected, text) {
            isConnected = connected;
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            
            indicator.className = `status-indicator ${connected ? '' : 'disconnected'}`;
            statusText.textContent = text;
        }

        function updateSendButton(enabled) {
            const button = document.getElementById('sendButton');
            button.disabled = !enabled;
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Auto-resize textarea
        function autoResize() {
            const textarea = document.getElementById('messageInput');
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            initializeStreaming();
            
            const input = document.getElementById('messageInput');
            input.addEventListener('keypress', handleKeyPress);
            input.addEventListener('input', autoResize);
            input.focus();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', function() {
            if (eventSource) {
                eventSource.close();
            }
        });
    </script>
</main>
</body>
</html>

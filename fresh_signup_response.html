<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ThriftAI</title>

    <!-- Bootstrap CSS -->
    <link href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>

    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet"/>

    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

    <style>
        .auth-container {
            max-width: 500px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, var(--accent) 0%, #007acc 100%);
            color: white;
            text-align: center;
            padding: var(--space-8) var(--space-6);
        }
        .auth-tabs {
            display: flex;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }
        .auth-tab {
            flex: 1;
            padding: var(--space-4) var(--space-6);
            text-align: center;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 510;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }
        .auth-tab:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .auth-tab.active {
            background: var(--bg-card);
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }
        .auth-body {
            padding: var(--space-8);
        }
        .form-group {
            margin-bottom: var(--space-6);
        }
        .form-label {
            display: block;
            margin-bottom: var(--space-2);
            font-weight: 590;
            color: var(--text-primary);
        }
        .form-control {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-input);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
            outline: none;
        }
        .btn-auth {
            width: 100%;
            padding: var(--space-4) var(--space-6);
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 590;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: var(--space-4);
        }
        .btn-auth:hover {
            background: #007acc;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }
        .form-row {
            display: flex;
            gap: var(--space-4);
        }
        .form-row .form-group {
            flex: 1;
        }
        .auth-footer {
            text-align: center;
            padding: var(--space-6);
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        .error-message {
            color: #dc3545;
            font-size: var(--font-size-caption);
            margin-top: var(--space-1);
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }
        .error-message::before {
            content: "⚠️";
            font-size: 0.9rem;
        }
        .form-control.error {
            border-color: #dc3545;
            box-shadow: 0 0 0 2px rgba(220, 53, 69, 0.1);
        }
        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #166534;
            padding: var(--space-3);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-4);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        .success-message::before {
            content: "✅";
            font-size: 1rem;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .user-type-icon {
            font-size: 2rem;
            margin-bottom: var(--space-2);
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <!-- Navigation (simple version for auth pages) -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fas fa-robot me-2" style="color: #00d4ff;"></i>
                <span style="background: linear-gradient(135deg, #00d4ff 0%, #ffffff 50%, #00d4ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700;">Thrift</span><span style="color: var(--text-primary); font-weight: 300;">AI</span>
            </a>
        </div>
    </nav>

<div class="container">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2 class="mb-2">
                    <i class="fas fa-user-plus me-2"></i>
                    Join ThriftAI
                </h2>
                <p class="mb-0 opacity-75">Choose your account type to get started</p>
            </div>
            
            <!-- Account Type Tabs -->
            <div class="auth-tabs">
                <button type="button" class="auth-tab active" id="buyer-tab" onclick="switchTab('buyer')">
                    <i class="fas fa-shopping-bag user-type-icon"></i><br>
                    I want to Buy
                </button>
                <button type="button" class="auth-tab" id="seller-tab" onclick="switchTab('seller')">
                    <i class="fas fa-store user-type-icon"></i><br>
                    I want to Sell
                </button>
            </div>
            
            <div class="auth-body">
                <!-- Success Message -->
                

                <!-- Buyer Registration Form -->
                <div id="buyer-form" class="tab-content active">
                    <form action="/auth/signup/buyer" method="post">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="buyerFirstName">First Name</label>
                                <input type="text" class="form-control" id="buyerFirstName" 
                                       required name="firstName" value="TestUser">
                                
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="buyerLastName">Last Name</label>
                                <input type="text" class="form-control" id="buyerLastName" 
                                       required name="lastName" value="Demo">
                                
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="buyerEmail">Email Address</label>
                            <input type="email" class="form-control" id="buyerEmail" 
                                   required name="email" value="kasjad512@gmail.com">
                            
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="buyerPhone">Phone Number <small class="text-muted">(optional)</small></label>
                            <input type="tel" class="form-control" id="buyerPhone" placeholder="e.g., 15551234567 or leave empty" name="phone" value="">
                            <div class="error-message">Please enter a valid phone number</div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="buyerPassword">Password</label>
                            <input type="password" class="form-control" id="buyerPassword"
                                   required
                                   placeholder="Min 8 chars, uppercase, lowercase, number, special char" name="password" value="">
                            
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="buyerCity">City</label>
                                <input type="text" class="form-control" id="buyerCity" name="city" value="TestCity">
                                
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="buyerState">State</label>
                                <input type="text" class="form-control" id="buyerState" name="state" value="TestState">
                                
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-auth">
                            <i class="fas fa-user-plus me-2"></i>
                            Create Buyer Account
                        </button>
                    </form>
                </div>
                
                <!-- Seller Registration Form -->
                <div id="seller-form" class="tab-content">
                    <form action="/auth/signup/seller" method="post">
                        <div class="form-group">
                            <label class="form-label" for="businessName">Business Name</label>
                            <input type="text" class="form-control" id="businessName" 
                                   required name="businessName" value="">
                            
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="ownerName">Owner/Contact Name</label>
                            <input type="text" class="form-control" id="ownerName" 
                                   required name="ownerName" value="">
                            
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="sellerEmail">Email Address</label>
                            <input type="email" class="form-control" id="sellerEmail" 
                                   required name="email" value="">
                            
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="sellerPhone">Phone Number</label>
                            <input type="tel" class="form-control" id="sellerPhone"
                                   required
                                   placeholder="e.g., 15551234567" name="phone" value="">
                            
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="sellerPassword">Password</label>
                            <input type="password" class="form-control" id="sellerPassword"
                                   required
                                   placeholder="Min 8 chars, uppercase, lowercase, number, special char" name="password" value="">
                            
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="sellerType">Business Type</label>
                            <select class="form-control" id="sellerType" required name="sellerType">
                                <option value="">Select Business Type</option>
                                <option value="INDIVIDUAL" selected="selected">Individual Seller</option>
                                <option value="BUSINESS">Business</option>
                                <option value="THRIFT_STORE">Thrift Store</option>
                                <option value="CONSIGNMENT_SHOP">Consignment Shop</option>
                            </select>
                            
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="address">Business Address</label>
                            <input type="text" class="form-control" id="address" 
                                   required name="address" value="">
                            
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label" for="sellerCity">City</label>
                                <input type="text" class="form-control" id="sellerCity" 
                                       required name="city" value="">
                                
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="sellerState">State</label>
                                <input type="text" class="form-control" id="sellerState" 
                                       required name="state" value="">
                                
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-auth">
                            <i class="fas fa-store me-2"></i>
                            Create Seller Account
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="auth-footer">
                <p class="mb-0 text-muted">
                    Already have an account? 
                    <a href="/auth/login" style="color: var(--accent); text-decoration: none;">
                        <strong>Sign In</strong>
                    </a>
                </p>
            </div>
        </div>
    </div>
    
    <script>
        function switchTab(type) {
            // Update tab buttons
            document.querySelectorAll('.auth-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(type + '-tab').classList.add('active');
            
            // Update form content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(type + '-form').classList.add('active');
        }
        
        // Auto-switch to seller tab if there are seller validation errors
        document.addEventListener('DOMContentLoaded', function() {
            const signupType = 'buyer';
            if (signupType === 'seller') {
                switchTab('seller');
            }

            // Highlight form fields with errors
            highlightErrorFields();
        });

        function highlightErrorFields() {
            // Add error class to fields that have error messages
            document.querySelectorAll('.error-message').forEach(errorMsg => {
                const fieldGroup = errorMsg.closest('.form-group');
                if (fieldGroup) {
                    const input = fieldGroup.querySelector('.form-control');
                    if (input) {
                        input.classList.add('error');

                        // Remove error styling when user starts typing
                        input.addEventListener('input', function() {
                            this.classList.remove('error');
                        });
                    }
                }
            });
        }

        // Password strength indicator
        function checkPasswordStrength(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /\d/.test(password),
                special: /[^A-Za-z0-9]/.test(password)
            };

            return requirements;
        }

        // Add real-time validation for password fields
        document.addEventListener('DOMContentLoaded', function() {
            const passwordFields = document.querySelectorAll('input[type="password"]');
            passwordFields.forEach(field => {
                field.addEventListener('input', function() {
                    const strength = checkPasswordStrength(this.value);
                    const allValid = Object.values(strength).every(req => req);

                    if (this.value.length > 0) {
                        if (allValid) {
                            this.style.borderColor = '#28a745';
                        } else {
                            this.style.borderColor = '#ffc107';
                        }
                    } else {
                        this.style.borderColor = '';
                    }
                });
            });
        });
    </script>
</div>

    <!-- Bootstrap JS -->
    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
    <script src="/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="/js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Test Search</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Search Test</h1>
    <input type="text" id="searchInput" placeholder="Enter search term">
    <button onclick="testSearch()">Search</button>
    <div id="results"></div>

    <script>
        function testSearch() {
            const query = document.getElementById('searchInput').value;
            console.log('Testing search for:', query);
            
            fetch('http://localhost:8080/ai/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: query,
                    type: 'search'
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Response:', data);
                document.getElementById('results').innerHTML = `
                    <h3>Results:</h3>
                    <p><strong>Message:</strong> ${data.message}</p>
                    <p><strong>Products:</strong> ${data.products ? data.products.length : 0}</p>
                    <p><strong>Insights:</strong> ${data.insights ? data.insights.length : 0}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('results').innerHTML = `<p>Error: ${error}</p>`;
            });
        }
    </script>
</body>
</html>

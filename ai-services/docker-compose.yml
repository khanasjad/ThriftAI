version: '3.8'

services:
  catalog-extractor:
    build:
      context: .
      dockerfile: Dockerfile.catalog
    ports:
      - "8085:8085"
    environment:
      - AI_SERVICE_TYPE=catalog_extractor
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./models:/app/models
      - ./temp:/tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  theme-engine:
    build:
      context: .
      dockerfile: Dockerfile.theme
    ports:
      - "8086:8086"
    environment:
      - AI_SERVICE_TYPE=theme_engine
      - PYTHONPATH=/app
    volumes:
      - ./models:/app/models
      - ./themes:/app/themes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

  ai-load-balancer:
    image: nginx:alpine
    ports:
      - "8087:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - catalog-extractor
      - theme-engine
    restart: unless-stopped

volumes:
  redis_data:
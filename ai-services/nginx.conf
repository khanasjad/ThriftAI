events {
    worker_connections 1024;
}

http {
    upstream catalog_extractor {
        server catalog-extractor:8085;
    }

    upstream theme_engine {
        server theme-engine:8086;
    }

    server {
        listen 80;

        # Load balancing for catalog extraction
        location /catalog/ {
            proxy_pass http://catalog_extractor/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts for AI processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;

            # Handle large file uploads
            client_max_body_size 50M;
        }

        # Load balancing for theme engine
        location /themes/ {
            proxy_pass http://theme_engine/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts for AI processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Default route for debugging
        location / {
            return 200 "AI Services Load Balancer\nAvailable endpoints:\n/catalog/ - Catalog Extraction Service\n/themes/ - Theme Engine Service\n/health - Health Check\n";
            add_header Content-Type text/plain;
        }
    }
}
version: '3.8'

services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: thriftai-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API (optional)
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # Performance settings
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
      # Optional: Enable API key for production
      # - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    restart: unless-stopped
    networks:
      - thriftai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for conversation memory (optional - can use Upstash cloud)
  redis:
    image: redis:7-alpine
    container_name: thriftai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-thriftai_dev}
    restart: unless-stopped
    networks:
      - thriftai-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL (existing - included for reference)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: thriftai-postgres
  #   environment:
  #     - POSTGRES_DB=${DATABASE_NAME}
  #     - POSTGRES_USER=${DATABASE_USER}
  #     - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - thriftai-network

volumes:
  qdrant_storage:
    driver: local
  redis_data:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  thriftai-network:
    driver: bridge

# Quick Start Commands:
# ====================
#
# Start all services:
#   docker-compose up -d
#
# Start only Qdrant:
#   docker-compose up -d qdrant
#
# View logs:
#   docker-compose logs -f qdrant
#
# Stop all services:
#   docker-compose down
#
# Stop and remove volumes (CAUTION - deletes data):
#   docker-compose down -v
#
# Check service health:
#   docker-compose ps
#
# Access Qdrant dashboard:
#   http://localhost:6333/dashboard
#
# Test Qdrant connection:
#   curl http://localhost:6333/

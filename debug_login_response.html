<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - ThriftAI</title>
    
    <!-- Bootstrap CSS -->
    <link href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
    
    <!-- Custom CSS -->
    <link href="/css/style.css" rel="stylesheet"/>
    
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    
    <style>
        .auth-container {
            max-width: 400px;
            margin: 3rem auto;
            padding: 0 1rem;
        }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, var(--accent) 0%, #007acc 100%);
            color: white;
            text-align: center;
            padding: var(--space-8) var(--space-6);
        }
        .auth-body {
            padding: var(--space-8);
        }
        .form-group {
            margin-bottom: var(--space-6);
        }
        .form-label {
            display: block;
            margin-bottom: var(--space-2);
            font-weight: 590;
            color: var(--text-primary);
        }
        .form-control {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-input);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
            outline: none;
        }
        .btn-auth {
            width: 100%;
            padding: var(--space-4) var(--space-6);
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 590;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: var(--space-4);
        }
        .btn-auth:hover {
            background: #007acc;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }
        .user-type-selector {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-6);
        }
        .user-type-option {
            flex: 1;
            padding: var(--space-3);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            text-align: center;
            cursor: pointer;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }
        .user-type-option:hover,
        .user-type-option.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .user-type-option input[type="radio"] {
            display: none;
        }
        .auth-footer {
            text-align: center;
            padding: var(--space-6);
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        .alert {
            padding: var(--space-4);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-6);
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #166534;
        }
        .alert-danger {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/;jsessionid=5470FC847EE2F605FB99A4E12B939E11">
                <i class="fas fa-robot me-2" style="color: #00d4ff;"></i>
                <span style="background: linear-gradient(135deg, #00d4ff 0%, #ffffff 50%, #00d4ff 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700;">Thrift</span><span style="color: var(--text-primary); font-weight: 300;">AI</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/;jsessionid=5470FC847EE2F605FB99A4E12B939E11">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/products;jsessionid=5470FC847EE2F605FB99A4E12B939E11">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/deals;jsessionid=5470FC847EE2F605FB99A4E12B939E11">AI Deals</a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light me-2" href="/auth/login;jsessionid=5470FC847EE2F605FB99A4E12B939E11" style="border-radius: var(--radius-md); padding: 0.5rem 1rem;">
                            <i class="fas fa-sign-in-alt me-1"></i>Login
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn" href="/auth/signup;jsessionid=5470FC847EE2F605FB99A4E12B939E11" style="background: var(--accent); color: white; border-radius: var(--radius-md); padding: 0.5rem 1rem; margin-left: 0.5rem;">
                            <i class="fas fa-user-plus me-1"></i>Sign Up
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="py-4">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h2 class="mb-2">
                            <i class="fas fa-sign-in-alt me-2"></i>
                            Welcome Back
                        </h2>
                        <p class="mb-0 opacity-75">Sign in to your ThriftAI account</p>
                    </div>
                    
                    <div class="auth-body">
                        <!-- Success Message -->
                        
                        
                        <!-- Error Message -->
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            <span>Invalid email or password</span>
                        </div>
                        
                        <form action="/auth/login;jsessionid=5470FC847EE2F605FB99A4E12B939E11" method="post">
                            <!-- User Type Selection -->
                            <div class="user-type-selector">
                                <label class="user-type-option active" id="buyer-option">
                                    <input type="radio" name="userType" value="buyer" 
                                           onchange="updateUserTypeSelection()" checked="checked">
                                    <i class="fas fa-shopping-bag d-block mb-1"></i>
                                    <small>Buyer</small>
                                </label>
                                <label class="user-type-option" id="seller-option">
                                    <input type="radio" name="userType" value="seller" 
                                           onchange="updateUserTypeSelection()">
                                    <i class="fas fa-store d-block mb-1"></i>
                                    <small>Seller</small>
                                </label>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="email">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="kasjad512@gmail.com" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="password">Password</label>
                                <input type="password" class="form-control" id="password" name="password" 
                                       required placeholder="Enter your password">
                            </div>
                            
                            <button type="submit" class="btn-auth">
                                <i class="fas fa-sign-in-alt me-2"></i>
                                Sign In
                            </button>
                        </form>
                    </div>
                    
                    <div class="auth-footer">
                        <p class="mb-2 text-muted">
                            Don't have an account? 
                            <a href="/auth/signup;jsessionid=5470FC847EE2F605FB99A4E12B939E11" style="color: var(--accent); text-decoration: none;">
                                <strong>Sign Up</strong>
                            </a>
                        </p>
                        <p class="mb-0">
                            <a href="#" style="color: var(--text-secondary); text-decoration: none; font-size: var(--font-size-caption);">
                                Forgot your password?
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script>
        function updateUserTypeSelection() {
            const buyerOption = document.getElementById('buyer-option');
            const sellerOption = document.getElementById('seller-option');
            const buyerRadio = buyerOption.querySelector('input[type="radio"]');
            const sellerRadio = sellerOption.querySelector('input[type="radio"]');
            
            if (buyerRadio.checked) {
                buyerOption.classList.add('active');
                sellerOption.classList.remove('active');
            } else if (sellerRadio.checked) {
                sellerOption.classList.add('active');
                buyerOption.classList.remove('active');
            }
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateUserTypeSelection();
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
    <script src="/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
